# Vikunja — the local issue tracker the strado agent works against through the
# veans CLI (mise, same release). One container, SQLite inside, no other service,
# reachable on this host only (127.0.0.1:3456).
#
#   start / refresh:  docker compose -f ~/.config/vikunja/compose.yaml up -d
#   secret:           ~/.config/vikunja/.env holds VIKUNJA_SERVICE_SECRET=<random>
#                     (mode 0600, per host, never in git; openssl rand -base64 48)
#   data:             ~/.local/share/vikunja/db (SQLite) and files (attachments),
#                     owned by uid 1000 — the container's user
#   backup:           vikunja_dump (scripts/) writes a dump zip into
#                     ~/w/pesto/vikunja/dumps; treesync carries it to the hub,
#                     kopia keeps the history. Restore = vikunja restore <zip>.
#   users:            docker exec vikunja /app/vikunja/vikunja user create \
#                       --username NAME --email MAIL --password PASS
#
# The image tag here and the veans version in mise/config.toml move together.
name: vikunja
services:
  vikunja:
    image: vikunja/vikunja:2.6.0
    container_name: vikunja
    env_file: .env
    environment:
      VIKUNJA_SERVICE_PUBLICURL: http://localhost:3456/
      VIKUNJA_DATABASE_PATH: /db/vikunja.db
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "false"
    ports:
      - "127.0.0.1:3456:3456"
    volumes:
      - ${HOME}/.local/share/vikunja/db:/db
      - ${HOME}/.local/share/vikunja/files:/app/vikunja/files
      - ${HOME}/w/pesto/vikunja/dumps:/dumps
    restart: unless-stopped
