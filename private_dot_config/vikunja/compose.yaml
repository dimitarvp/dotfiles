# Vikunja — the strado agent's issue tracker (veans CLI on the workstations),
# ONE instance on s1 (Dimi 2026-09-12: no two-way sync of SQLite databases).
# Server-gated in .chezmoiignore: workstations never render this file.
#
#   URL:      http://vikunja.home.arpa:3456/  (AGH rewrite → 192.168.1.99, this box)
#   start:    docker compose -f ~/.config/vikunja/compose.yaml up -d
#   secret:   ~/.config/vikunja/.env — VIKUNJA_SERVICE_SECRET=<random>, 0600, unmanaged
#             (captured nightly by s1_capture with the rest of ~/.config)
#   data:     ~/.local/share/vikunja/db (SQLite) + files (attachments) on the root
#             SSD, never on the USB pool; stage/ = the container's /dumps
#   backup:   vikunja_dump, nightly from s1_capture → /data/misc/backups/s1config/vikunja;
#             the dataset snapshot keeps the history. Nothing else, no kopia (his ruling).
#   restore:  docker compose -f … stop
#             printf 'Yes, I understand\n\n' | docker compose -f … run --rm -T vikunja restore /dumps/<zip>
#             docker compose -f … up -d          (same image version as the dump)
#   users:    docker exec vikunja /app/vikunja/vikunja user create|list|reset-password …
#
# The image tag here and the veans version in mise/config.toml move together.
name: vikunja
services:
  vikunja:
    image: vikunja/vikunja:2.6.0
    container_name: vikunja
    env_file: .env
    environment:
      VIKUNJA_SERVICE_PUBLICURL: http://vikunja.home.arpa:3456/
      VIKUNJA_DATABASE_PATH: /db/vikunja.db
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "false"
    ports:
      - "192.168.1.99:3456:3456"
    volumes:
      - ${HOME}/.local/share/vikunja/db:/db
      - ${HOME}/.local/share/vikunja/files:/app/vikunja/files
      - ${HOME}/.local/share/vikunja/stage:/dumps
    restart: unless-stopped
