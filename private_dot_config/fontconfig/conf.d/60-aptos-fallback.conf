<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Aptos (MS Office default font since 2024) has no free metric-compatible
       clone; without an alias fontconfig falls back to DejaVu Serif, the wrong
       font class entirely. Carlito (Calibri metrics) is the closest installed
       sans. Rendering approximates layout; it is not metric-exact for Aptos. -->
  <alias binding="same">
    <family>Aptos</family>
    <accept><family>Carlito</family></accept>
  </alias>
  <alias binding="same">
    <family>Aptos Display</family>
    <accept><family>Carlito</family></accept>
  </alias>
  <!-- fontconfig's stock metric aliases cover "Calibri" but not the
       "Calibri Light" heading variant Word themes use -->
  <alias binding="same">
    <family>Calibri Light</family>
    <accept><family>Carlito</family></accept>
  </alias>
</fontconfig>
