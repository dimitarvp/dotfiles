# VRRP green — VIP 192.168.1.96 floats between agh-blue (.97), agh-green (.98)
# and the MikroTik router (priority 50 = unfiltered fallback when s1 is fully down).
# Shares the AGH container's netns; VIP lands on its eth0 when MASTER.
# Dialect must match the router's /interface/vrrp vrid 96: VRRPv3, multicast,
# 300ms adverts, no auth (v3 has no auth field). Never re-add unicast_peer —
# RouterOS speaks multicast VRRP only.
global_defs {
    enable_script_security
    script_user root
    vrrp_version 3
}
vrrp_script chk_agh {
    script "/usr/local/bin/agh_check.sh"
    interval 2
    timeout 2
    fall 2
    rise 2
}
vrrp_instance AGH {
    state BACKUP
    interface eth0
    virtual_router_id 96
    priority 100
    advert_int 0.3
    virtual_ipaddress { 192.168.1.96/24 }
    track_script { chk_agh }
}
