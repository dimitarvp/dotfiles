# VRRP green — VIP 192.168.1.96 floats between agh-blue (.97) and agh-green (.98).
# Shares the AGH container's netns; VIP lands on its eth0 when MASTER.
global_defs {
    enable_script_security
    script_user root
}
vrrp_script chk_agh {
    script "/usr/local/bin/agh_check.sh"
    interval 2
    timeout 2
    fall 2
    rise 2
}
vrrp_instance AGH {
    state BACKUP
    interface eth0
    virtual_router_id 96
    priority 100
    advert_int 0.3
    unicast_src_ip 192.168.1.98
    unicast_peer { 192.168.1.97 }
    authentication {
        auth_type PASS
        auth_pass sB7tcHaM
    }
    virtual_ipaddress { 192.168.1.96/24 }
    track_script { chk_agh }
}
