# VRRP green — VIPs float between agh-blue, agh-green and each net's MikroTik
# router (priority 50 = unfiltered fallback when s1 is fully down):
#   net1 (cooolbox): VIP 192.168.1.96, instances .97/.98
#   net2 (bulsatcom): VIP 192.168.2.96, instances 2.97/2.98 [2026-08-29]
# Shares the AGH container's netns; VIPs land on net1/net2 when MASTER. The
# interface names are pinned via compose interface_name — kernel eth-order
# is a race with multiple networks (bit us 2026-08-29: blue came up swapped).
# Dialect must match the routers' /interface/vrrp vrid 96: VRRPv3, multicast,
# 300ms adverts, no auth (v3 has no auth field). Never re-add unicast_peer —
# RouterOS speaks multicast VRRP only. Same vrid 96 on both interfaces is
# valid: VRID scope is per-link, and the two LANs are separate L2 domains.
global_defs {
    enable_script_security
    script_user root
    vrrp_version 3
}
vrrp_script chk_agh {
    script "/usr/local/bin/agh_check.sh"
    interval 2
    timeout 2
    fall 2
    rise 2
}
vrrp_instance AGH {
    state BACKUP
    interface net1
    virtual_router_id 96
    priority 100
    advert_int 0.3
    virtual_ipaddress { 192.168.1.96/24 }
    track_script { chk_agh }
}
vrrp_instance AGH_NET2 {
    state BACKUP
    interface net2
    virtual_router_id 96
    priority 100
    advert_int 0.3
    virtual_ipaddress { 192.168.2.96/24 }
    track_script { chk_agh }
}
